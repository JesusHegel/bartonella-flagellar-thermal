# Entorno de conda con los programas y versiones exactas del analisis.
# Crear (una sola vez):   conda env create -f entorno/bartonella.yml
# Activar:                conda activate bartonella
name: bartonella
channels:
  - conda-forge
  - bioconda
dependencies:
  # Cuantificacion (solo para la replica completa desde el SRA)
  - salmon=2.4.1
  - sra-tools=3.4.1
  # Genomica comparada
  - ncbi-datasets-cli=18.33.1
  - blast=2.17.0
  - viennarna=2.7.0
  - python=3.12   # 3.13 no es compatible con viennarna 2.7.0
  - unzip
  # Analisis estadistico
  - r-base=4.5.3
  - bioconductor-tximport=1.38.2
  - bioconductor-deseq2=1.50.2
  - r-ashr=2.2.63
  - bioconductor-fgsea=1.36.2
  - r-ggplot2=4.0.3
  - r-igraph=2.3.3
  - r-ggrepel=0.9.8
